[project]
name = "entirius-django-reviews"
version = "2.0.0"
description = "Product reviews and ratings for Django with a REST API and optional Magento export"
authors = [{ name = "Entirius" }]
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
dependencies = [
    "django>=5.0",
    "marshmallow>=3.19",
    "marshmallow-dataclass>=8.5",
    "tqdm>=4.60",
    "entirius-django-utils>=2.0.0",
    "entirius-django-pim>=3.0.0",
    "entirius-django-accounts>=5.0.0",
    "entirius-py-bievents>=2.0.0",
    "entirius-py-process-logger>=2.0.0",
]

[project.optional-dependencies]
dev  = ["ruff", "pre-commit"]
test = [
    "pytest",
    "pytest-django",
    # django_accounts (Review.customer FK target) sits in test INSTALLED_APPS; its URLconf pulls
    # verify_captcha (lazy django_captcha import in django_utils), mirroring entirius-django-accounts' tests.
    "entirius-django-captcha>=2.0.0",
]
# Soft integration (try/except ImportError + graceful degradation) — see deptry note below.
magento = ["entirius-py-magento2-sdk2>=2.0.0"]  # Review.send_to_magento pushes reviews when present

[project.urls]
Repository = "https://github.com/entirius/entirius-django-reviews"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/django_reviews"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "DJ", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101", "S105"]
# Legacy migrated 1:1 — pre-existing lint debt, tracked outside this repo; do not grow these lists.
"src/django_reviews/models/review.py" = ["B026", "DJ001", "DJ008", "DJ012", "F821"]
"src/django_reviews/models/apikey.py" = ["DJ008", "DJ012"]
"src/django_reviews/models/product_representation.py" = ["DJ001", "DJ012"]
"src/django_reviews/domain/dto/review.py" = ["E731"]
"src/django_reviews/domain/importers/review_importer.py" = ["UP028"]
"src/django_reviews/views/review.py" = ["B904"]
"src/django_reviews/worker/fill_reviews_product_representation.py" = ["B904", "F401"]
"src/django_reviews/worker/fill_products_magento_ids.py" = ["B905"]
"src/django_reviews/worker/manage_reviews.py" = ["F811"]
"src/django_reviews/management/commands/import-reviews.py" = ["B904"]

[tool.ruff.lint.isort]
known-first-party = ["django_reviews"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["."]

[tool.deptry]
pep621_dev_dependency_groups = ["dev", "test"]

[tool.deptry.per_rule_ignores]
# django_checkout is imported only under TYPE_CHECKING (utils/pagination.py — type hint for Channel).
# It is not a runtime dependency and entirius-django-checkout is not yet released (Etap 5).
DEP001 = ["django_checkout"]
